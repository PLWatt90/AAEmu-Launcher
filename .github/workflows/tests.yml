# Runs the end-to-end test script on every push to main and on every pull request, under both
# PowerShell 7 and Windows PowerShell 5.1 (the README promises both).
#
# Safe for pull requests from forks: the "pull_request" trigger gives those runs a read-only token
# and no secrets, and this workflow asks for nothing more than reading the code.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  run-tests:
    name: Run-Tests.ps1 (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    # The matrix picks the shell here: a step's own "shell" may not use the matrix context.
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build everything and run the end-to-end tests
        run: ./tests/Run-Tests.ps1
